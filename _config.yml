title: RIT360 Realiza
description: "Manual do usuário e documentação oficial do RIT360 Realiza — coordenação de projetos e operações contínuas para Organizações da Sociedade Civil, pela RIT."
lang: pt-BR
url: https://docs.realiza.rit360.org.br
permalink: pretty

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Tema / cor — ver _sass/color_schemes/rit360.scss.
# ⚠️ O design system da família NÃO fica neste container: mora um nível acima,
# em /mnt/trabalho/Projetos/RIT/RIT360/Projeto/Brand/design-system.md, porque é
# compartilhado por Financeiro, Premiado e Solidário. Procurar por ele dentro do
# Realiza dá falso negativo.
# Acento do Realiza é o VERDE, não o navy que domina a arte do logo: navy já é
# o acento do Financeiro, e é a cor que faz quem usa os dois produtos saber de
# relance qual está aberto. Decisão registrada no design system da família.
color_scheme: rit360
logo: "/assets/logo.png"
favicon_ico: "/assets/favicon.png"

# Busca
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Callouts (admonitions) — mesmos nomes usados nos outros manuais da casa,
# para quem escreve não precisar aprender um vocabulário por produto.
callouts:
  note:
    title: Nota
    color: blue
  tip:
    title: Dica
    color: green
  warning:
    title: Atenção
    color: yellow
  important:
    title: Importante
    color: red
  example:
    title: Exemplo
    color: purple

# Links auxiliares (canto superior direito)
aux_links:
  "Acessar o RIT360 Realiza":
    - "https://realiza.rit360.org.br"
aux_links_new_tab: true

# Rodapé
footer_content: '© 2026 <a href="https://rit.org.br" target="_blank" rel="noopener">RIT — Rede de Inovação e Transformação</a>. Todos os direitos reservados.'
last_edit_timestamp: false
back_to_top: true
back_to_top_text: "Voltar ao topo"

# Excluir do build (não publicar no site)
exclude:
  - "*.sh"
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
